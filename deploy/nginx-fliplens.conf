map $http_cf_connecting_ip $fliplens_client_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

limit_req_zone $fliplens_client_key zone=fliplens_per_ip:10m rate=6r/m;
limit_conn_zone $fliplens_client_key zone=fliplens_connections:10m;

server {
    listen 80;
    server_name www.fliplens.space;
    return 301 https://fliplens.space$request_uri;
}

server {
    listen 80;
    server_name fliplens.space;

    client_max_body_size 45m;

    location = /api/analyze {
        limit_req zone=fliplens_per_ip burst=2 nodelay;
        limit_conn fliplens_connections 2;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
